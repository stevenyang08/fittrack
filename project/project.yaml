project:
  name: fittrack
  vision: 'Mock fitness app: track workouts and calories with a working login and
    sortable stats'
  status: roadmap_approved
  created: '2026-08-20'
  updated: '2026-08-20'
mvp:
  definition: 'A single Expo/React Native app (iOS + Android) where a user can create
    a local account, log in and out, log workouts (type, duration, calories burned)
    and calorie entries (description, calories consumed), and view a stats screen
    with summary totals/averages and a history list sortable by date, calories, duration,
    and type. All data is stored locally in SQLite; no backend.

    '
  in_scope:
  - Expo managed-workflow app in TypeScript, one codebase for iOS and Android (DEC-1)
  - 'Local SQLite persistence via expo-sqlite: users, workouts, calorie_entries (DEC-2)'
  - 'Local-only auth: registration, login, logout, salted+hashed credentials, in-memory
    session (DEC-3)'
  - Optional 'stay signed in' via expo-secure-store (P1 within MVP)
  - 'Log a workout: type, duration (minutes), calories burned, date/time'
  - 'Log a calorie entry: description, calories, date/time'
  - 'Stats screen: totals and averages (workouts, minutes, calories burned/consumed,
    net)'
  - History list with sorting by date, calories, duration, and type (asc/desc)
  - 'Navigation: auth stack when signed out, tab stack (Workouts, Calories, Stats)
    when signed in'
  - Unit/component test coverage runnable in CI without physical devices (jest + RN
    Testing Library)
  out_of_scope:
  - Cloud sync or any backend services
  - Hosted/real authentication, password reset, email verification
  - Social features, sharing, leaderboards
  - Wearable/HealthKit/Google Fit integrations
  - Push notifications
  - Charts/graphs beyond simple lists and summary numbers (fast-follow candidate)
  - Editing/deleting logged entries (fast-follow candidate; confirm with human)
  - Multi-device or multi-user-per-device account switching beyond basic logout/login
