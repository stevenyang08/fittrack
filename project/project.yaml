implementation_order:
  sequence:
  - FIT-1
  - FIT-2
  - FIT-3
  - FIT-4
  - FIT-5
  - FIT-6
  - FIT-7
  - FIT-8
  - FIT-9
  - FIT-10
  - FIT-11
  - FIT-12
  - FIT-13
  rationale: 'Foundation first (scaffold, then schema) because every story depends
    on them. Auth next (core logic, session, navigation shell, screens) because all
    tracking data is scoped to a logged-in user and the shell is needed to host any
    screen. Workout tracking before calorie tracking because the two are structurally
    parallel and workouts exercise the richer model (type, duration, calories); calorie
    stories can reuse its patterns and could even run in parallel with FIT-8 if two
    developers are available. Stats last among P0 work because it consumes both data
    layers. FIT-13 (stay signed in) is P1 polish that touches auth and login UI, so
    it lands after both are stable.

    '
risks:
- id: R1
  risk: expo-sqlite cannot run inside jest on a dev machine; untested SQL may only
    fail on device
  mitigation: Data layer designed behind a thin adapter so SQL executes against a
    Node SQLite driver in tests; device smoke test before release
- id: R2
  risk: Local-only auth gives no real security guarantees (device compromise exposes
    hashes); could be mistaken for production-grade auth
  mitigation: DEC-3 scopes this as mock/local; salted hashing via expo-crypto; document
    limitation in README; swap for hosted auth post-MVP
- id: R3
  risk: GitHub repo/board sync (DEC-4) not yet connected in this environment; stories
    exist only as local files
  mitigation: Stories authored 1:1 issue-ready; sync as soon as GitHub access is configured
- id: R4
  risk: Scope creep toward charts, editing entries, or cloud sync mid-MVP
  mitigation: Explicit out_of_scope list; changes go through human approval
open_questions:
- id: Q1
  question: 'Workout types: fixed preset list (e.g. Run, Walk, Cycle, Strength, Swim,
    Other) or free text? Stories assume preset list + Other for clean type sorting.'
  blocking:
  - FIT-7
  - FIT-8
- id: Q2
  question: 'Password policy for local accounts: stories assume minimum 8 characters
    and no other complexity rules. OK?'
  blocking:
  - FIT-3
  - FIT-6
- id: Q3
  question: Should stats include net calories (burned minus consumed)? Stories assume
    yes as a single summary number.
  blocking:
  - FIT-11
  - FIT-12
- id: Q4
  question: Is editing/deleting logged entries required for MVP? Currently scoped
    out as a fast-follow.
  blocking: []
- id: Q5
  question: When should GitHub repo + board sync (DEC-4) happen — before implementation
    starts, or in parallel?
  blocking: []
