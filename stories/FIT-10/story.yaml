story:
  id: FIT-10
  title: Log Calories screen
  description: 'Replace the Calories tab placeholder with a functional screen: a form
    to log a calorie entry (description, calories, date/time) wired to FIT-9, plus
    a recent-entries list so a save is immediately visible. Mirrors the FIT-8 pattern.

    '
  feature: F5 Calorie tracking
  priority: P0
  mvp: true
  status: approved
  dependencies:
  - FIT-5
  - FIT-9
  acceptance_criteria:
  - 'Calories tab shows a form with: description (text), calories (numeric keyboard),
    and date/time defaulting to now'
  - Invalid input shows inline error messages mapped from FIT-9 validation errors;
    Save is blocked while invalid
  - Saving calls addCalorieEntry with the signed-in user's id, clears the form, shows
    a success confirmation, and the new entry appears at the top of the recent list
    without app restart
  - The recent list shows description, calories, and date for the signed-in user only,
    newest first, with an empty state when the user has no entries
  - All behaviors covered by React Native Testing Library tests with the FIT-9 service
    mocked or backed by the test adapter
  assumptions_and_research:
  - Intentionally mirrors FIT-8's layout and components for consistency and reuse
    (shared form field components encouraged)
  - Full sortable history lives on the Stats screen (FIT-12); this list is capped
    at ~10 recent items
  - Can be implemented in parallel with FIT-8 by a second developer since both depend
    only on FIT-5 plus their own data layer
  open_questions: []
  approved_by: Steven
  approved_date: '2026-08-20'
